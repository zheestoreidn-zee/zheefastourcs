<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhee Fastour CS - Official Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        /* Header Kapsul */
        .capsule-header-wrapper {
            position: fixed;
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 1000;
            padding: 0 16px;
        }

        .capsule-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 8px 18px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-btn {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Container Utama */
        .container {
            max-width: 800px;
            margin: 100px auto 0 auto;
            padding: 0 20px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Header Kapsul -->
    <div class="capsule-header-wrapper">
        <header class="capsule-header">
            <div class="logo-area">
                <div class="live-dot"></div>
                <span>ZHEE FASTOUR CS</span>
            </div>
            <div class="header-actions">
                <button class="login-btn" id="google-login-btn">Login Google</button>
                <button class="menu-toggle">☰</button>
            </div>
        </header>
    </div>

    <!-- Dashboard Ringkas -->
    <div class="container">
        <div class="glass-card">
            <h1>Terminal Utama Fastour CS</h1>
            <p>
                Platform resmi layanan turnamen kilat dan manajemen *room* berbasis sistem transparan. Silakan pantau status room atau masuk menggunakan akun Google untuk mengakses menu klaim kemenangan dan riwayat penarikan.
            </p>
        </div>
    </div>

</body>
</html>
